name: Byg Android-app

# Kun manuel kørsel: automatisk bygning ved hvert push fejlede og sendte fejlmails.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CAP_RELEASE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      # android/ is committed (white icon/splash already generated); `cap add` would fail.
      - run: npx cap sync android
      - name: Byg APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v5
        with:
          name: serviceydere-medarbejder-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
