name: Byg Android-app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      CAP_RELEASE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - run: npx cap add android
      - name: App-ikon og opstartsskærm
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#012941' --splashBackgroundColor '#012941'
      - run: npx cap sync android
      - name: Byg APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: serviceydere-medarbejder-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
